name: Propose update catalog

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      CATALOG_APP_ID:
        required: false
      CATALOG_APP_PRIVATE_KEY:
        required: false
  workflow_dispatch:
    inputs:
      release_tag:
        description: Already public release to independently verify and propose
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-catalog-writer
  cancel-in-progress: false

jobs:
  credentials:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    outputs:
      configured: ${{ steps.preflight.outputs.configured }}
    steps:
      - name: Check catalog automation credentials
        id: preflight
        env:
          CATALOG_APP_ID: ${{ secrets.CATALOG_APP_ID }}
          CATALOG_APP_PRIVATE_KEY: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
        run: |
          if [ -z "$CATALOG_APP_ID" ] || [ -z "$CATALOG_APP_PRIVATE_KEY" ]; then
            echo 'configured=false' >> "$GITHUB_OUTPUT"
            echo '::warning::catalog-pending: configure the catalog GitHub App credentials, then run Propose update catalog on develop for the already public release. Do not dispatch another application release.'
            echo 'catalog-pending: application publication is separate from catalog preparation. Catalog GitHub App credentials are missing; configure them and retry Propose update catalog for the public release tag. No catalog PR was created and no catalog was deployed.' >> "$GITHUB_STEP_SUMMARY"
          else
            echo 'configured=true' >> "$GITHUB_OUTPUT"
          fi

  propose:
    needs: credentials
    if: needs.credentials.outputs.configured == 'true' && (github.ref == 'refs/heads/develop')
    runs-on: macos-latest
    steps:
      # An installation token triggers normal pull_request CI. GITHUB_TOKEN
      # deliberately cannot be used as a fallback for catalog proposals.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v7
        with:
          python-version: '3.13'
      - name: Install package inspection tools
        run: |
          brew install sevenzip dpkg
          python3 -m pip install pefile==2024.8.26
      - name: Propose independently verified catalogs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          python3 scripts/propose-release-catalog.py >> "$GITHUB_STEP_SUMMARY"
