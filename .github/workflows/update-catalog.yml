name: Propose update catalog

on:
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      CATALOG_APP_ID:
        required: true
      CATALOG_APP_PRIVATE_KEY:
        required: true
  schedule:
    - cron: '43 3 * * *'
  workflow_dispatch:
    inputs:
      release_tag:
        description: Already public release to independently verify and propose
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: update-catalog-writer
  cancel-in-progress: false

jobs:
  propose:
    if: github.ref == 'refs/heads/develop' || github.event_name == 'schedule'
    runs-on: macos-latest
    steps:
      # An installation token triggers normal pull_request CI. GITHUB_TOKEN
      # deliberately cannot be used as a fallback for catalog proposals.
      - uses: actions/create-github-app-token@v3
        id: app
        with:
          app-id: ${{ secrets.CATALOG_APP_ID }}
          private-key: ${{ secrets.CATALOG_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - uses: actions/checkout@v7
        with:
          ref: develop
          fetch-depth: 0
          token: ${{ steps.app.outputs.token }}
      - uses: actions/setup-python@v6
        with:
          python-version: '3.13'
      - name: Install package inspection tools
        run: |
          brew install sevenzip dpkg
          python3 -m pip install pefile==2024.8.26
      - name: Propose independently verified catalogs
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          RELEASE_TAG: ${{ inputs.release_tag }}
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          if [ "${{ github.event_name }}" = schedule ]; then
            python3 scripts/propose-release-catalog.py --reconcile >> "$GITHUB_STEP_SUMMARY"
          else
            python3 scripts/propose-release-catalog.py >> "$GITHUB_STEP_SUMMARY"
          fi
