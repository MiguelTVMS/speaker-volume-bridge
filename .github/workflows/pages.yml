name: Website

on:
  push:
    branches: [main]
    paths:
      - "pages/**"
      - "Cargo.toml"
      - "package.json"
      - "scripts/generate-website-build-data.py"
      - "scripts/publish-website-markdown.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  deploy:
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
      contents: read
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/configure-pages@v6
      - name: Resolve website build metadata
        run: python3 scripts/generate-website-build-data.py
      - name: Build website and guide
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./pages
          destination: ./_site
      - name: Publish Markdown guide sources
        run: |
          sudo chown -R "$(id -u):$(id -g)" _site
          python3 scripts/publish-website-markdown.py --destination _site
      - uses: actions/upload-pages-artifact@v5
        with:
          path: _site
      - name: Deploy website
        id: deployment
        uses: actions/deploy-pages@v5
      - name: Verify served update catalog
        env:
          PAGE_URL: ${{ steps.deployment.outputs.page_url }}
        run: |
          curl --fail --location --silent --show-error \
            --dump-header "$RUNNER_TEMP/catalog-headers.txt" \
            --output "$RUNNER_TEMP/catalog.json" \
            "${PAGE_URL%/}/updates/v1/catalog.json"
          python3 scripts/validate-update-catalog.py "$RUNNER_TEMP/catalog.json"
          curl --fail --silent --show-error "${PAGE_URL%/}/updates/v2/catalog.json" -o "$RUNNER_TEMP/preview-catalog.json"
          python3 scripts/validate-update-catalog.py "$RUNNER_TEMP/preview-catalog.json"
          grep --ignore-case --quiet '^cache-control:' "$RUNNER_TEMP/catalog-headers.txt"
