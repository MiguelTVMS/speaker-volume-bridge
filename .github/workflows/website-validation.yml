name: Website validation

on:
  pull_request:
    branches-ignore: [main]
    paths:
      - "pages/**"
      - "scripts/generate-page-markdown.py"
      - "scripts/tests/consent.test.cjs"
      - "scripts/tests/test_website_seo.py"
      - "scripts/tests/test_update_catalog.py"
      - "scripts/tests/test_update_catalog_publication.py"
      - "scripts/prepare-update-catalog.py"
      - "scripts/validate-update-catalog.py"
      - ".github/workflows/update-catalog.yml"
      - ".github/workflows/website-validation.yml"

permissions:
  contents: read

jobs:
  consent:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "lts/*"
      - run: node --test scripts/tests/consent.test.cjs
      - run: python3 scripts/generate-page-markdown.py --check
      - run: python3 -m unittest discover -s scripts/tests -p test_website_seo.py
      - run: python3 -m unittest discover -s scripts/tests -p test_update_catalog.py
      - run: python3 -m unittest discover -s scripts/tests -p test_update_catalog_publication.py
      - run: python3 scripts/validate-update-catalog.py
